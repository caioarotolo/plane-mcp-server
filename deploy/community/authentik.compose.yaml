name: plane-auth
services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    image: ${AUTHENTIK_IMAGE:?pin the official image digest}
    command: server
    restart: unless-stopped
    environment: &auth_env
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_DB_PASSWORD:?required}
      AUTHENTIK_SECRET_KEY: ${AUTH_SECRET_KEY:?required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_WEB__WORKERS: "2"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - data:/data
    networks:
      default:
      plane:
        aliases: [plane-auth]
    mem_limit: 1536m
    shm_size: 256m
  worker:
    image: ${AUTHENTIK_IMAGE:?pin the official image digest}
    command: worker
    restart: unless-stopped
    environment:
      <<: *auth_env
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${AUTH_BOOTSTRAP_PASSWORD_HASH:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - data:/data
    mem_limit: 1536m
    shm_size: 256m
volumes:
  database:
  data:
networks:
  plane:
    external: true
    name: plane_default
